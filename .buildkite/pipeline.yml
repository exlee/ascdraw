# Nightly pipeline.
#
# Pipeline settings in Buildkite:
# - Pipeline schedule with cron "17 3 * * *" on the default branch.
# - Buildkite secret GH_TOKEN: GitHub token with contents:write on the repository.
# - Buildkite hosted agent queues: "linux-medium", "linux-2204", "macos-medium".
#
# A scheduled build runs only when the commit differs from the latest nightly
# release. Any other build source (UI, API) always builds.
steps:
  - label: ":mag: Check for changes since last nightly"
    key: check-changes
    agents:
      queue: linux-medium
    command: .buildkite/scripts/check_changes.sh
