# Uploaded by scripts/nightly_changes.rb when a nightly build is due.
env:
  CARGO_TERM_COLOR: always

steps:
  - label: ":linux: Build ascdraw-linux"
    key: build-linux
    # Pinned to the oldest supported distribution: glibc is backwards
    # compatible only, so the binary must link against the lowest
    # version we intend to run on.
    agents:
      queue: linux-ubuntu-22-04
    env:
      ARTIFACT_NAME: ascdraw-linux
      MAX_GLIBC: "2.35"
    command: .buildkite/scripts/build_binary.sh
    artifact_paths: dist/ascdraw-linux.tar.gz

  - label: ":mac: Build ascdraw-macos"
    key: build-macos
    agents:
      queue: macos
    env:
      ARTIFACT_NAME: ascdraw-macos
    command: .buildkite/scripts/build_binary.sh
    artifact_paths: dist/ascdraw-macos.tar.gz

  - label: ":package: Build macOS DMG"
    key: build-macos-dmg
    agents:
      queue: macos
    command: .buildkite/scripts/build_dmg.sh
    artifact_paths: dist/Ascdraw.dmg

  - wait

  - label: ":rocket: Release nightly artifacts"
    key: release-nightly
    agents:
      queue: linux
    command: .buildkite/scripts/release_nightly.sh
